name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      use_mathlib_cache:
        description: Download the pinned mathlib cache before verification
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: "2"
      MATHLIB_NO_CACHE_ON_UPDATE: "1"
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false

      - name: Install the committed Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          lint: "false"
          use-github-cache: "false"
          use-mathlib-cache: "false"

      # The verifier checks all dependency revisions before invoking Lake.
      - name: Materialize the committed dependency manifest
        run: lake --no-cache env lean --version

      # A cache outage may cost build time, but does not skip verification.
      - name: Fetch the optional mathlib cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.use_mathlib_cache }}
        continue-on-error: true
        timeout-minutes: 10
        run: lake --no-cache exe cache get

      # Cached CI is separate from the documented artifact-free reproduction.
      # This runner owns the full build, public-root check and all fresh audits.
      - name: Run all release verification gates
        run: python3 scripts/verify_release.py --evidence "$RUNNER_TEMP/fsc-ci-evidence"

      - name: Preserve verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lean-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fsc-ci-evidence
          if-no-files-found: warn
          retention-days: 30
